name: Scrape Wembley events

# Runs daily and republishes the site (app + fresh events.json) to GitHub Pages.
on:
  push:
    branches: [main] # deploy on every push, including the first one
  schedule:
    - cron: '17 5 * * *' # 05:17 UTC daily — off-the-hour to avoid runner congestion
  workflow_dispatch: # lets you trigger a run by hand from the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scrape events
        run: node scrape.js --out events.json

      - name: Show diff
        run: git --no-pager diff --stat events.json || true

      - name: Commit if changed
        run: |
          if git diff --quiet events.json; then
            echo "No change in event data."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: refresh Wembley event data"
            git push
          fi

      - name: Package site
        run: |
          mkdir -p _site
          cp index.html events.json manifest.webmanifest sw.js _site/
          cp icon-*.png _site/ 2>/dev/null || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
