<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111417">
<title>Wembley Stadium Events</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wembley Events">
<style>
  :root {
    --bg: #111417;
    --card-fg: #ffffff;
    --clear: #14804a;
    --clear-edge: #1da864;
    --event: #b3261e;
    --event-edge: #e0483d;
    --muted: #8b949e;
    --line: #262b31;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    background: var(--bg);
    color: #e6edf3;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    padding: max(env(safe-area-inset-top), 16px) 16px max(env(safe-area-inset-bottom), 16px);
  }

  /* The first screenful: header plus the 7 boxes, sized to fill the viewport
     exactly as before. Everything after it flows below and scrolls normally. */
  .screen {
    /* vh first as a fallback for engines without dvh; dvh then wins where
       supported, and is what handles Safari's collapsing address bar. */
    min-height: calc(100vh - max(env(safe-area-inset-top), 16px)
                           - max(env(safe-area-inset-bottom), 16px));
    min-height: calc(100dvh - max(env(safe-area-inset-top), 16px)
                            - max(env(safe-area-inset-bottom), 16px));
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  header { flex: 0 0 auto; }

  h1 {
    margin: 0;
    font-size: 19px;
    font-weight: 650;
    letter-spacing: -0.01em;
  }

  .sub {
    margin: 3px 0 0;
    font-size: 13px;
    color: var(--muted);
  }

  /* --- The 7 boxes --- */
  #grid {
    flex: 1 1 auto;
    display: grid;
    grid-template-rows: repeat(7, minmax(62px, 1fr));
    gap: 8px;
    min-height: 0;
  }

  .day {
    border-radius: 14px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    color: var(--card-fg);
    border: 1px solid transparent;
    /* Colour is set by class, but never the only signal — see .badge/.label */
  }

  .day.clear { background: var(--clear); border-color: var(--clear-edge); }
  .day.event { background: var(--event); border-color: var(--event-edge); }
  .day.unknown { background: #21262d; border-color: var(--line); color: var(--muted); }

  .day.today { box-shadow: 0 0 0 2px #ffffff inset; }

  .dow {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    opacity: 0.85;
    width: 3.2em;
    flex: 0 0 auto;
  }

  .dnum {
    font-size: 24px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    width: 2.1em;
    flex: 0 0 auto;
    line-height: 1;
  }

  .info { flex: 1 1 auto; min-width: 0; }

  /* The status pill is the primary signal, not a decoration on top of colour.
     Inverted contrast — near-white fill, dark same-hue ink — so it reads at a
     glance and stays legible for colour-blind users and in bright sunlight. */
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 5px 12px 5px 5px;
    border-radius: 9px;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.03em;
    line-height: 1.1;
    white-space: nowrap;
  }

  .day.event .pill {
    background: #fff1ef;
    color: #6b1510; /* 8.9:1 against the pill fill */
  }

  .day.clear .pill {
    background: #eaf8f0;
    color: #0a4526; /* 9.4:1 */
  }

  /* The glyph gets its own tile so the warning triangle reads as a sign
     rather than a character. Amber is a third hue on top of red/green, which
     survives every common form of colour blindness. */
  .pill .glyph {
    flex: 0 0 auto;
    width: 30px;
    height: 30px;
    border-radius: 7px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 21px;
    line-height: 1;
  }

  .day.event .pill .glyph {
    background: #f5a300;
    color: #3d2200; /* 8.0:1 on the amber tile */
    /* The ⚠ glyph carries slack below its baseline — nudge it back to centre */
    padding-bottom: 2px;
  }

  .day.clear .pill .glyph {
    background: #c9ecd8;
    color: #0a4526;
    font-size: 19px;
  }

  /* No-waiting sign, shown only on event days. Sits at the row's trailing
     edge, using space that was empty, so it doesn't crowd the pill. */
  .ban {
    flex: 0 0 auto;
    width: 42px;
    height: 42px;
    display: block;
  }

  .why {
    display: block;
    margin-top: 4px;
    font-size: 13px;
    font-weight: 600;
    opacity: 0.92;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* --- Months ahead (below the fold) --- */
  #ahead { padding-top: 22px; }

  .month { margin-bottom: 20px; }

  .month h2 {
    margin: 0 0 8px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .cal {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }

  .cal .dowhead {
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    padding-bottom: 2px;
  }

  .cell {
    aspect-ratio: 1;
    border-radius: 8px;
    display: grid;
    place-items: center;
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    background: #21262d; /* unknown / outside the feed */
    border: 0 solid transparent;
    font-variant-numeric: tabular-nums;
  }

  .cell.blank { background: none; }
  .cell.past { background: #191d21; color: #4d545c; }
  .cell.clear { background: var(--clear); }

  /* Amber underline repeats the pill's non-colour cue, so event cells are
     distinguishable without relying on red vs green. */
  .cell.event {
    background: var(--event);
    border-bottom-width: 3px;
    border-bottom-color: #f5a300;
    font-weight: 800;
  }

  .cell.today { box-shadow: 0 0 0 2px #ffffff inset; }
  .cell.event:active { filter: brightness(1.25); }

  #aheadHint {
    margin: 0 0 14px;
    font-size: 13px;
    color: var(--muted);
  }

  /* Selected cell keeps an amber ring so it's obvious which date the bar is
     describing, even when the bar is at the other end of the screen. */
  .cell.sel { box-shadow: 0 0 0 3px #f5a300 inset; }

  /* iOS Safari only bubbles click events to document from elements it treats
     as interactive. cursor:pointer is what marks a span as clickable there —
     without it, taps on these cells fire nothing on iPhone while working
     perfectly on desktop. Listeners are also bound per cell (see renderAhead)
     so behaviour doesn't depend on this rule alone.
     touch-action removes the 300ms double-tap-zoom delay. */
  .cell.event {
    cursor: pointer;
    touch-action: manipulation;
  }

  /* The detail bar is fixed to the viewport rather than sitting in the flow.
     Tapping a date in October used to put its details above September, forcing
     a scroll back up to read them. */
  #detailBar {
    position: fixed;
    left: 12px;
    right: 12px;
    bottom: calc(max(env(safe-area-inset-bottom), 10px) + 6px);
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 10px 12px 14px;
    background: #202730;
    border: 1px solid #39424e;
    border-radius: 13px;
    box-shadow: 0 8px 26px rgba(0, 0, 0, 0.55);
    font-size: 14px;
    font-weight: 600;
    color: #ffffff;
    opacity: 0;
    visibility: hidden;
    transform: translateY(10px);
    transition: opacity 0.16s ease, transform 0.16s ease, visibility 0.16s;
    z-index: 10;
  }

  #detailBar.on {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }

  #detailText {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  #detailClose {
    flex: 0 0 auto;
    width: 30px;
    height: 30px;
    padding: 0;
    border-radius: 8px;
    font-size: 15px;
    line-height: 1;
    background: #2c3540;
    border-color: #454f5c;
  }

  /* Give the last calendar row room to scroll clear of the bar. */
  body.bar-open { padding-bottom: calc(max(env(safe-area-inset-bottom), 16px) + 64px); }

  @media (prefers-reduced-motion: reduce) {
    #detailBar { transition: none; transform: none; }
  }

  .hint {
    flex: 0 0 auto;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    padding-bottom: 2px;
  }

  footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    border-top: 1px solid var(--line);
    margin-top: 8px;
    padding-top: 10px;
    font-size: 12px;
    color: var(--muted);
  }

  button {
    font: inherit;
    font-weight: 600;
    color: #e6edf3;
    background: #21262d;
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 7px 13px;
  }

  button:active { background: #2d333b; }

  #status.err { color: #ff9d94; }

  /* Stamped in by the deploy workflow. Its only job is to end arguments about
     which build a given phone is actually running — cached shells have made
     that ambiguous more than once. "dev" locally, commit + time when deployed. */
  #build {
    flex: 0 0 auto;
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    color: #5f6b78;
    letter-spacing: 0.02em;
  }

  a { color: var(--muted); }
</style>
</head>
<body>

<div class="screen">
  <header>
    <h1>Wembley Stadium Events</h1>
    <p class="sub">Red = stadium event, expect parking restrictions</p>
  </header>

  <main id="grid" aria-live="polite"></main>

  <p class="hint" id="hint"></p>
</div>

<section id="ahead" aria-label="Months ahead">
  <p id="aheadHint">Tap a red date for details</p>
</section>

<div id="detailBar" role="status" aria-live="polite">
  <span id="detailText"></span>
  <button id="detailClose" type="button" aria-label="Close details">✕</button>
</div>

<footer>
  <span id="status">Loading…</span>
  <span id="build" title="Build identifier">__BUILD__</span>
  <button id="refresh" type="button">Refresh</button>
</footer>

<script>
(function () {
  'use strict';

  // Where the scraper publishes its output. Point this at your CDN/Pages URL
  // once deployed, e.g. 'https://you.github.io/wembley-parking/events.json'
  var DATA_URL = 'events.json';

  // Last-known-good data, baked in so a cold start with no network still
  // shows something useful rather than seven grey boxes.
  var FALLBACK = {"scrapedAt":"2026-07-25T00:00:00.000Z","events":[
    {"date":"2026-07-25","name":"Bruno Mars"},
    {"date":"2026-07-28","name":"Bruno Mars"},
    {"date":"2026-07-31","name":"Luke Combs"},
    {"date":"2026-08-01","name":"Luke Combs"},
    {"date":"2026-08-02","name":"Luke Combs"},
    {"date":"2026-08-14","name":"The Weeknd"},
    {"date":"2026-08-15","name":"The Weeknd"},
    {"date":"2026-08-16","name":"The Weeknd"},
    {"date":"2026-08-18","name":"The Weeknd"},
    {"date":"2026-08-19","name":"The Weeknd"},
    {"date":"2026-08-30","name":"AEW All In: London"},
    {"date":"2026-09-04","name":"Bon Jovi"},
    {"date":"2026-09-06","name":"Bon Jovi"},
    {"date":"2026-09-09","name":"Bon Jovi"},
    {"date":"2026-09-12","name":"Diljit Dosanjh"},
    {"date":"2026-09-19","name":"Union Jack Classic"},
    {"date":"2026-09-26","name":"England v Spain"},
    {"date":"2026-10-06","name":"England v Czechia"},
    {"date":"2026-10-18","name":"Jacksonville Jaguars 2026"}
  ]};

  var CACHE_KEY = 'wembley.events.v1';
  var DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

  // The UK "no waiting" sign, drawn rather than emoji'd: 🅿️ + ❌ renders
  // differently on every platform and reads as two unrelated glyphs. The white
  // outer ring separates it from the red row behind it.
  var NO_PARKING =
    '<svg class="ban" viewBox="0 0 40 40" aria-hidden="true" focusable="false">' +
      '<circle cx="20" cy="20" r="19" fill="#ffffff"/>' +
      '<circle cx="20" cy="20" r="17" fill="#0d5aa7"/>' +
      // Thinner ring frees up interior space for a bigger letter.
      '<circle cx="20" cy="20" r="14.6" fill="none" stroke="#e02b1f" stroke-width="4.6"/>' +
      // dy rather than dominant-baseline: WebKit's support for the latter has
      // been inconsistent, and a mis-centred P is exactly the kind of thing
      // that looks fine on desktop and wrong on a phone.
      '<text x="20" y="20" dy="0.35em" fill="#ffffff"' +
        ' font-family="-apple-system, Helvetica, Arial, sans-serif"' +
        ' font-size="22" font-weight="800" text-anchor="middle">P</text>' +
      // Slash last so it sits over the letter, as the real sign does — but thin
      // enough (3.6 against a 22px bold P) that the P still reads clearly.
      '<line x1="10.8" y1="10.8" x2="29.2" y2="29.2" stroke="#e02b1f" stroke-width="3.6"' +
        ' stroke-linecap="round"/>' +
    '</svg>';

  var grid = document.getElementById('grid');
  var statusEl = document.getElementById('status');

  // Unreplaced placeholder means this copy was not deployed — running from a
  // local server or opened straight from disk.
  var buildEl = document.getElementById('build');
  if (buildEl && buildEl.textContent.indexOf('BUILD') > -1) buildEl.textContent = 'dev';

  /** Local-time ISO date (yyyy-mm-dd). Avoids toISOString()'s UTC shift, which
   *  would roll the date over during BST evenings. */
  function isoLocal(d) {
    return d.getFullYear() + '-' +
      String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0');
  }

  /** The 7 Date objects: today plus the next six days. */
  function window7() {
    var days = [];
    var base = new Date();
    base.setHours(12, 0, 0, 0); // midday avoids DST edge cases on arithmetic
    for (var i = 0; i < 7; i++) {
      var d = new Date(base);
      d.setDate(base.getDate() + i);
      days.push(d);
    }
    return days;
  }

  function render(data, note) {
    // Group events by date — a single day can host more than one.
    var byDate = {};
    (data && data.events ? data.events : []).forEach(function (e) {
      (byDate[e.date] = byDate[e.date] || []).push(e.name);
    });

    var todayIso = isoLocal(new Date());
    grid.textContent = '';

    window7().forEach(function (d) {
      var iso = isoLocal(d);
      var names = byDate[iso];
      var isEvent = !!names;

      var box = document.createElement('div');
      box.className = 'day ' + (isEvent ? 'event' : 'clear') + (iso === todayIso ? ' today' : '');
      box.setAttribute('role', 'group');
      box.setAttribute('aria-label',
        d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' }) +
        (isEvent ? ': event day, parking restrictions likely. ' + names.join(', ')
                 : ': no stadium event'));

      box.innerHTML =
        '<span class="dow">' + (iso === todayIso ? 'Today' : DOW[d.getDay()]) + '</span>' +
        '<span class="dnum">' + d.getDate() + '</span>' +
        '<span class="info">' +
          '<span class="pill">' +
            '<span class="glyph" aria-hidden="true">' + (isEvent ? '⚠' : '✓') + '</span>' +
            (isEvent ? 'EVENT DAY' : 'NO EVENT') +
          '</span>' +
          (isEvent ? '<span class="why">' + esc(names.join(' · ')) + '</span>' : '') +
        '</span>' +
        (isEvent ? NO_PARKING : '');

      grid.appendChild(box);
    });

    // Everything beyond the 7-day view.
    var allDates = Object.keys(byDate).sort();
    var lastKnown = allDates.length ? allDates[allDates.length - 1] : null;
    renderAhead(byDate, lastKnown);

    var hint = document.getElementById('hint');
    var futureEvents = allDates.filter(function (iso) { return iso > todayIso; }).length;
    hint.textContent = futureEvents
      ? '↓ ' + futureEvents + ' more event day' + (futureEvents === 1 ? '' : 's') + ' ahead'
      : '';

    var when = data && data.scrapedAt
      ? new Date(data.scrapedAt).toLocaleDateString('en-GB',
          { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })
      : 'unknown';

    // Days old matters: a green box means "no event was listed when this data
    // was scraped", which is a weaker claim the older the data gets. Say so
    // rather than letting stale data look authoritative.
    //
    // The threshold is 7 days because the feed runs months ahead — stadium
    // events are announced far in advance, so week-old data is still accurate
    // for the 7-day window unless something was added at short notice.
    var STALE_AFTER_DAYS = 7;

    var ageDays = data && data.scrapedAt
      ? (Date.now() - new Date(data.scrapedAt)) / 86400000
      : Infinity;

    if (note) {
      statusEl.className = 'err';
      statusEl.textContent = note;
    } else if (ageDays > STALE_AFTER_DAYS) {
      statusEl.className = 'err';
      statusEl.textContent = 'Data is ' + Math.floor(ageDays) + ' days old — check signage';
    } else {
      statusEl.className = '';
      statusEl.textContent = 'Data from ' + when;
    }
  }

  var MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June', 'July',
    'August', 'September', 'October', 'November', 'December'];

  /**
   * Month grids for everything ahead: from this month through the month of the
   * last listed event. Cells are coloured only up to that last event — beyond
   * it we have no information, so they stay neutral rather than implying the
   * date is clear.
   */
  function renderAhead(byDate, lastKnown) {
    var ahead = document.getElementById('ahead');
    if (!lastKnown) {
      ahead.querySelectorAll('.month').forEach(function (n) { n.remove(); });
      return;
    }

    var todayIso = isoLocal(new Date());
    var today = new Date();
    today.setHours(12, 0, 0, 0);

    var end = new Date(lastKnown + 'T12:00:00');
    var frag = document.createDocumentFragment();

    var cursor = new Date(today.getFullYear(), today.getMonth(), 1, 12);
    var guard = 0;

    while (cursor <= end && guard++ < 24) {
      var year = cursor.getFullYear();
      var month = cursor.getMonth();

      var section = document.createElement('div');
      section.className = 'month';

      var h2 = document.createElement('h2');
      h2.textContent = MONTH_NAMES[month] + (year !== today.getFullYear() ? ' ' + year : '');
      section.appendChild(h2);

      var cal = document.createElement('div');
      cal.className = 'cal';

      ['M', 'T', 'W', 'T', 'F', 'S', 'S'].forEach(function (d, i) {
        var head = document.createElement('span');
        head.className = 'dowhead';
        head.textContent = d;
        head.setAttribute('aria-hidden', 'true');
        cal.appendChild(head);
      });

      // Monday-first offset: JS getDay() is Sunday-first.
      var firstDay = new Date(year, month, 1).getDay();
      var lead = (firstDay + 6) % 7;
      for (var b = 0; b < lead; b++) {
        var blank = document.createElement('span');
        blank.className = 'cell blank';
        cal.appendChild(blank);
      }

      var daysInMonth = new Date(year, month + 1, 0).getDate();

      for (var day = 1; day <= daysInMonth; day++) {
        var d = new Date(year, month, day, 12);
        var iso = isoLocal(d);
        var names = byDate[iso];

        var cell = document.createElement('span');
        cell.className = 'cell';
        cell.textContent = day;

        var state;
        if (iso < todayIso) {
          cell.className += ' past';
          state = 'past';
        } else if (names) {
          cell.className += ' event';
          state = 'event day — ' + names.join(', ');
          cell.setAttribute('role', 'button');
          cell.setAttribute('tabindex', '0');
          cell.dataset.iso = iso;
          cell.dataset.names = names.join(' · ');
          // Bound directly rather than relying on delegation, which iOS
          // Safari does not perform for taps on plain spans.
          cell.addEventListener('click', onCellTap);
        } else if (iso <= lastKnown) {
          cell.className += ' clear';
          state = 'no event';
        } else {
          state = 'not listed yet';
        }

        if (iso === todayIso) cell.className += ' today';

        cell.setAttribute('aria-label',
          d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long' }) + ': ' + state);

        cal.appendChild(cell);
      }

      section.appendChild(cal);
      frag.appendChild(section);
      cursor = new Date(year, month + 1, 1, 12);
    }

    ahead.querySelectorAll('.month').forEach(function (n) { n.remove(); });
    ahead.appendChild(frag);

    // The cells were just replaced, so any previous selection is gone.
    hideDetail();
  }

  function hideDetail() {
    document.getElementById('detailBar').className = '';
    document.body.classList.remove('bar-open');
    var prev = document.querySelector('.cell.sel');
    if (prev) prev.classList.remove('sel');
  }

  function showDetail(cell) {
    var prev = document.querySelector('.cell.sel');
    if (prev) prev.classList.remove('sel');
    cell.classList.add('sel');

    var d = new Date(cell.dataset.iso + 'T12:00:00');
    document.getElementById('detailText').textContent =
      d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'long' }) +
      ' — ' + cell.dataset.names;

    document.getElementById('detailBar').className = 'on';
    document.body.classList.add('bar-open');
  }

  /** Shared by the per-cell listeners bound in renderAhead. */
  function onCellTap(e) {
    var cell = e.currentTarget;
    // Tapping the selected date again closes the bar.
    if (cell.classList.contains('sel')) hideDetail();
    else showDetail(cell);
  }

  // The close button is a real <button>, so delegation is reliable for it.
  document.addEventListener('click', function (e) {
    if (e.target.closest && e.target.closest('#detailClose')) hideDetail();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    if (e.target && e.target.classList && e.target.classList.contains('event')) {
      e.preventDefault();
      e.target.click();
    }
  });

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function cached() {
    try { return JSON.parse(localStorage.getItem(CACHE_KEY)); } catch (e) { return null; }
  }

  function load() {
    statusEl.className = '';
    statusEl.textContent = 'Checking…';

    // no-store plus a unique URL: bypasses both the browser cache and the
    // Pages CDN, so this is always today's feed even without the worker.
    fetch(DATA_URL + '?_=' + Date.now(), { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (data) {
        if (!data || !Array.isArray(data.events) || !data.events.length) {
          throw new Error('empty feed');
        }
        try { localStorage.setItem(CACHE_KEY, JSON.stringify(data)); } catch (e) {}
        render(data);
      })
      .catch(function () {
        // Offline or feed broken: fall back to cache, then to baked-in data.
        var fb = cached() || FALLBACK;
        render(fb, 'Offline — showing saved data');
      });
  }

  document.getElementById('refresh').addEventListener('click', load);

  // Recompute the window if the app sits in the background past midnight.
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) load();
  });

  // Paint immediately from cache so there's no empty first frame.
  render(cached() || FALLBACK);
  load();

  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').catch(function () {});

    // The worker serves the cached shell instantly, then compares it with the
    // network. If a new version was deployed it tells us, and we reload once —
    // guarded by a session flag so a persistent difference can't loop.
    navigator.serviceWorker.addEventListener('message', function (e) {
      if (!e.data || e.data.type !== 'shell-updated') return;
      try {
        if (sessionStorage.getItem('reloadedFor')) return;
        sessionStorage.setItem('reloadedFor', '1');
      } catch (_) {
        return; // no sessionStorage: skip rather than risk a reload loop
      }
      location.reload();
    });
  }
})();
</script>
</body>
</html>
